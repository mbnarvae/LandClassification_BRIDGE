name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}
      - name: Install
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install -e ".[dev]"
      - name: Lint
        run: uv run ruff check src tests autoresearch scripts
      - name: Test
        run: uv run pytest --cov=bridge_lc
      - name: Autoresearch smoke test
        run: |
          uv run python autoresearch/prepare.py --synthetic
          uv run python autoresearch/train.py
