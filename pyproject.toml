[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bridge-lc"
version = "0.1.0"
description = "BRIDGE land classification: foundation-model ecosystem mapping for the Andes-Amazon, with Noah-MP export"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Manuel Narvaez" }]
keywords = ["land cover", "foundation models", "Prithvi", "Andes", "Amazon", "Noah-MP", "ecohydrology", "paramo"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: GIS",
  "Topic :: Scientific/Engineering :: Hydrology",
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "pyyaml>=6.0",
  "scikit-learn>=1.4",
  "typer>=0.12",
  "rich>=13.0",
]

[project.optional-dependencies]
geo = [
  "rasterio>=1.3",
  "rioxarray>=0.15",
  "xarray>=2024.1",
  "geopandas>=0.14",
  "shapely>=2.0",
  "pystac-client>=0.7",
  "planetary-computer>=1.0",
  "odc-stac>=0.3",
  "netCDF4>=1.6",
  "earthengine-api>=0.1.390",
]
fm = [
  "torch>=2.2",
  "torchvision>=0.17",
  "terratorch>=1.0",
  "timm>=1.0",
  "huggingface-hub>=0.23",
  "peft>=0.11",
  "lightning>=2.2",
]
boost = ["xgboost>=2.0", "lightgbm>=4.0"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "pre-commit>=3.7",
  "jupyterlab>=4.0",
]
all = ["bridge-lc[geo,fm,boost,dev]"]

[project.scripts]
bridge-lc = "bridge_lc.cli:app"

[project.urls]
Repository = "https://github.com/mbnarvae/LandClassification_BRIDGE"

[tool.hatch.build.targets.wheel]
packages = ["src/bridge_lc"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]
ignore = ["B008"]  # typer.Argument/Option defaults are idiomatic

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
