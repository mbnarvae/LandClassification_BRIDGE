# RUN B (main) — Prithvi-EO-2.0 300M-TL + LoRA (r=16 on Q/V + MLP) + UNet decoder, 2 seasonal frames.
# LoRA ≈ full fine-tuning accuracy and generalises better to unseen regions (arXiv 2504.17397).
trainer:
  logger:
    init_args: {name: run_b_prithvi300tl_lora}
data:
  init_args:
    # Albumentations needs HWC: flatten frames into channels, augment, then restore (C, T, H, W).
    train_transform:
      - class_path: terratorch.datasets.transforms.FlattenTemporalIntoChannels
      - class_path: albumentations.D4
      - class_path: ToTensorV2
      - class_path: terratorch.datasets.transforms.UnflattenTemporalFromChannels
        init_args: {n_timesteps: 2}
model:
  init_args:
    model_args:
      backbone: prithvi_eo_v2_300_tl
      backbone_pretrained: true
      backbone_bands: [BLUE, GREEN, RED, NIR_NARROW, SWIR_1, SWIR_2]
      backbone_num_frames: 2
      backbone_coords_encoding: []     # generic datamodule provides no time/location metadata
      necks:
        - {name: SelectIndices, indices: [5, 11, 17, 23]}
        - {name: ReshapeTokensToImage, effective_time_dim: 2}
        - {name: LearnedInterpolateToPyramidal}
      decoder: UNetDecoder
      decoder_channels: [512, 256, 128, 64]
      head_dropout: 0.1
      num_classes: 19
      peft_config:
        method: LORA
        replace_qkv: qkv
        peft_config_kwargs:
          target_modules: [qkv.q_linear, qkv.v_linear, mlp.fc1, mlp.fc2]
          r: 16
          lora_alpha: 16
