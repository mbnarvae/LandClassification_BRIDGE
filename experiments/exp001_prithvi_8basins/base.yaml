# EXP001 shared TerraTorch config. Combine with one run file:
#   terratorch fit -c base.yaml -c run_b_prithvi300tl_lora.yaml
# (later -c files override earlier ones; see run_exp001.sh)
seed_everything: 42
trainer:
  accelerator: auto            # CUDA on a GPU server, MPS on Apple Silicon
  devices: 1
  precision: 32-true           # use bf16-mixed on Ampere+ GPUs (not reliable on MPS)
  max_epochs: 80
  log_every_n_steps: 10
  default_root_dir: models_store/exp001
  logger:
    class_path: lightning.pytorch.loggers.CSVLogger
    init_args: {save_dir: models_store/exp001, name: RUN_NAME}
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args: {monitor: val/F1_Score, mode: max, save_top_k: 1, save_last: true, filename: "best-{epoch}"}
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args: {monitor: val/F1_Score, mode: max, patience: 20}
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args: {logging_interval: epoch}

data:
  class_path: terratorch.datamodules.GenericNonGeoSegmentationDataModule
  init_args:
    batch_size: 8
    num_workers: 4
    num_classes: 19            # 18 BRIDGE classes + nodata (0)
    train_data_root: data/processed/exp001/chips
    val_data_root: data/processed/exp001/chips
    test_data_root: data/processed/exp001/chips
    train_split: data/processed/exp001/splits/train.txt
    val_split: data/processed/exp001/splits/val.txt
    test_split: data/processed/exp001/splits/test.txt
    img_grep: "*_img.tif"
    label_grep: "*_mask.tif"
    # Chips hold 2 seasonal frames × 6 HLS bands, frame-major (dry: 6 bands, wet: 6 bands).
    dataset_bands: [BLUE, GREEN, RED, NIR_NARROW, SWIR_1, SWIR_2]
    output_bands: [BLUE, GREEN, RED, NIR_NARROW, SWIR_1, SWIR_2]
    expand_temporal_dimension: true
    # Prithvi-EO-2.0 pretraining statistics, HLS reflectance ×10000 (same scale as our chips).
    means: [1087.0, 1342.0, 1433.0, 2734.0, 1958.0, 1363.0]
    stds: [2248.0, 2179.0, 2178.0, 1850.0, 1242.0, 1049.0]
    no_data_replace: 0         # cloud gaps (-9999) → 0 before normalisation
    no_label_replace: 0
    train_transform:
      - class_path: albumentations.D4      # flips + 90° rotations
      - class_path: ToTensorV2

model:
  class_path: terratorch.tasks.SemanticSegmentationTask
  init_args:
    model_factory: EncoderDecoderFactory
    loss: ce
    ignore_index: 0
    # class_weights: injected by run_exp001.sh from data/processed/exp001/class_weights.txt
    freeze_backbone: false     # frozen probing underperforms badly (≈52 vs ≈68 mIoU, arXiv 2504.17397)
    plot_on_val: false
    class_names: [nodata, lowland_evergreen_forest, lowland_flooded_forest, premontane_forest,
                  montane_cloud_forest, polylepis_woodland, montane_shrubland, paramo_grassland,
                  humid_puna_grassland, dry_puna_shrub_grassland, bofedal_peatland, superparamo_sparse,
                  rock_scree_barren, snow_ice_glacier, water, cropland_pasture, crop_natural_mosaic,
                  forest_plantation, urban_built]

optimizer:
  class_path: torch.optim.AdamW
  init_args: {lr: 1.0e-4, weight_decay: 0.1}
lr_scheduler:
  class_path: lightning.pytorch.cli.ReduceLROnPlateau
  init_args: {monitor: val/loss, mode: min, factor: 0.5, patience: 5}
